packages:
  - '.'

# esbuild, sharp and workerd fetch or link platform binaries in a postinstall
# script. pnpm blocks build scripts unless they are listed here.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

overrides:
  sharp@<0.35.0: ^0.35.0
  sharp@<0.35.4: ^0.35.4
  sharp@<0.35.5: ^0.35.5
  undici@>=7.0.0 <7.24.0: ^7.24.0
  undici@>=7.0.0 <7.28.0: ^7.28.0
  undici@>=7.0.0 <7.29.0: ^7.29.0
  undici@>=7.0.0 <7.29.1: ^7.29.1
  ws@>=8.0.0 <8.21.0: ^8.21.0
